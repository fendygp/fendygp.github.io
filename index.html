<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fendy Gusta Pradana - Halaman Utama</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0a0a0a;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 2rem 1.5rem;
        }

        .profile {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .profile h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .profile p {
            font-size: 0.9rem;
            color: #6b6b6b;
            margin-top: 0.4rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .link-item {
            display: block;
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 1rem 1.25rem;
            text-decoration: none;
            color: #0a0a0a;
            font-weight: 500;
            font-size: 0.95rem;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .link-item:hover {
            background: #4f46e5;
            color: #ffffff;
            border-color: #4f46e5;
            transform: translateY(-1px);
        }

        .link-item .icon {
            width: 36px;
            height: 36px;
            background: #f0f0f0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .link-item:hover .icon {
            background: #4338ca;
        }

        .link-item .text {
            display: flex;
            flex-direction: column;
        }

        .link-item .text span {
            font-size: 0.75rem;
            color: #6b6b6b;
            font-weight: 400;
            margin-top: 1px;
            transition: color 0.15s;
        }

        .link-item:hover .text span {
            color: #aaaaaa;
        }

        .footer {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: #aaaaaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <h1>Fendy GP</h1>
        </div>

        <div class="links">
            <a href="cobahp.html" class="link-item">
                <div class="icon">&#x2696;&#xFE0F;</div>
                <div class="text">
                    SuperAHP Multi-Expert
                    <span>Penilaian Grup dengan Rata-rata Geometrik</span>
                </div>
            </a>
        </div>

        <div class="footer">
            &copy; 2025 Fendy Gusta Pradana
        </div>
    </div>
</body>
</html>
